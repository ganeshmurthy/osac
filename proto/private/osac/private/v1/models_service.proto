syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/model_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message ModelsListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
}

message ModelsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated Model items = 3;
}

message ModelsGetRequest { string id = 1; }
message ModelsGetResponse { Model object = 1; }
message ModelsCreateRequest { Model object = 1; }
message ModelsCreateResponse { Model object = 1; }

message ModelsUpdateRequest {
  Model object = 1;
  // Supported paths: metadata.labels, metadata.annotations, spec.replicas,
  // spec.compute_resources, spec.placement, and spec.scaling. Source, profile,
  // runtime, and model identity cannot be changed after creation.
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message ModelsUpdateResponse { Model object = 1; }
message ModelsDeleteRequest { string id = 1; }
message ModelsDeleteResponse {}

message ModelsListPlacementClustersRequest {}
message ModelsListPlacementClustersResponse {
  repeated ModelPlacementCluster clusters = 1;
}

service Models {
  rpc List(ModelsListRequest) returns (ModelsListResponse) {
    option (google.api.http) = {get: "/api/private/v1/models"};
  }
  rpc Get(ModelsGetRequest) returns (ModelsGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/models/{id}"
      response_body: "object"
    };
  }
  rpc Create(ModelsCreateRequest) returns (ModelsCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/models"
      body: "object"
      response_body: "object"
    };
  }
  rpc Update(ModelsUpdateRequest) returns (ModelsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/private/v1/models/{object.id}"
      body: "object"
      response_body: "object"
    };
  }
  rpc Delete(ModelsDeleteRequest) returns (ModelsDeleteResponse) {
    option (google.api.http) = {delete: "/api/private/v1/models/{id}"};
  }
  rpc ListPlacementClusters(ModelsListPlacementClustersRequest) returns (ModelsListPlacementClustersResponse) {
    option (google.api.http) = {get: "/api/private/v1/models:listPlacementClusters"};
  }
}
